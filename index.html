<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wire Cutter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1117;
      font-family: 'Courier New', monospace;
      color: #e0e0e0;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #00ff88;
      display: inline-block;
      margin-right: 8px;
      animation: pulse 1.5s infinite;
    }

    .dot.error { background: #ff4444; animation: none; }
    .dot.loading { background: #ffaa00; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    h1 {
      font-size: 1.1rem;
      font-weight: normal;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 2rem;
    }

    .status-line {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }

    .ip-display {
      font-size: 1.4rem;
      color: #00ff88;
      letter-spacing: 0.05em;
      margin: 1rem 0 1.5rem;
      min-height: 2rem;
    }

    .ip-display.error { color: #ff4444; font-size: 1rem; }

    .btn {
      display: inline-block;
      padding: 0.7rem 1.8rem;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-primary {
      background: #00ff88;
      color: #0f1117;
      font-weight: bold;
    }

    .btn-primary:hover { background: #00cc6a; }
    .btn-primary:disabled { background: #1f4a36; color: #555; cursor: not-allowed; }

    .countdown {
      margin-top: 1.2rem;
      font-size: 0.78rem;
      color: #444;
    }

    .divider {
      border: none;
      border-top: 1px solid #2a2d3a;
      margin: 1.8rem 0;
    }

    .updated {
      font-size: 0.75rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>✂️ Wire Cutter</h1>

    <div class="status-line">
      <span class="dot loading" id="dot"></span>
      <span id="status-text">Locating machine...</span>
    </div>

    <div class="ip-display" id="ip-display">—</div>

    <button class="btn btn-primary" id="connect-btn" disabled onclick="connectNow()">
      Connect
    </button>

    <div class="countdown" id="countdown"></div>

    <hr class="divider"/>
    <div class="updated" id="last-updated">Last updated: —</div>
  </div>

  <script>
    // ── CONFIG ──────────────────────────────────────────────
    const BIN_ID    = "6a854e40da38895dfef5d53c";
    // Leave API_KEY empty and set the bin to PUBLIC in JSONBin.
    // A key pasted here is readable by anyone who opens this page, and a
    // JSONBin *master* key can write to ALL your bins - not just this one.
    // If you really need a key, generate a read-only Access Key for it.
    const API_KEY   = "";
    const ESP32_PATH = "/";   // "/" serves breadboardv3.html
    const STALE_MINS = 90;    // firmware heartbeats hourly; warn past this
    const AUTO_REDIRECT = false; // true = jump automatically after 3s
    // ────────────────────────────────────────────────────────

    let currentIP = null;
    let countdownTimer = null;

    async function fetchIP() {
      setLoading();
      try {
        // Public bin needs no key; only send the header if one is set.
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: API_KEY ? { "X-Access-Key": API_KEY } : {}
        });
        if (!res.ok) throw new Error(`JSONBin returned ${res.status}`);
        const data = await res.json();

        const record = data.record || {};
        const ip = record.ip;
        // The firmware writes uptime_s (seconds since boot), NOT updated_at -
        // the ESP32 has no NTP clock, so it can't produce a real timestamp.
        // JSONBin's own metadata carries the wall-clock write time instead.
        const uptimeS  = record.uptime_s;
        const binTime  = data.metadata && data.metadata.createdAt;

        if (!ip) throw new Error("No IP published yet");

        currentIP = ip;
        retryCount = 0;   // success - reset the backoff ladder
        setReady(ip, uptimeS, binTime);
        if (AUTO_REDIRECT) scheduleRedirect(ip);
        else document.getElementById("countdown").textContent = "Press Connect to open the breadboard tool";

      } catch (e) {
        setError(e.message);
      }
    }

    function setLoading() {
      dot("loading");
      document.getElementById("status-text").textContent = "Locating machine...";
      document.getElementById("ip-display").className = "ip-display";
      document.getElementById("ip-display").textContent = "—";
      document.getElementById("connect-btn").disabled = true;
      document.getElementById("countdown").textContent = "";
    }

    function setReady(ip, uptimeS, binTime) {
      dot("ready");
      document.getElementById("status-text").textContent = "Machine online";
      document.getElementById("ip-display").textContent = ip;
      document.getElementById("connect-btn").disabled = false;

      let line = "";
      if (binTime) {
        const d = new Date(binTime);
        const ageMin = (Date.now() - d.getTime()) / 60000;
        line = "Last seen: " + d.toLocaleString();
        // The bin is only as fresh as the last push. If the board has been
        // off since, this IP is a leftover and the redirect will hang.
        if (ageMin > STALE_MINS) {
          line += "  (stale - board may be off)";
          document.getElementById("status-text").textContent = "Machine offline?";
          dot("loading");
        }
      }
      if (uptimeS != null) {
        const h = Math.floor(uptimeS / 3600);
        const m = Math.floor((uptimeS % 3600) / 60);
        line += (line ? " | " : "") + `Board uptime at push: ${h}h ${m}m`;
      }
      document.getElementById("last-updated").textContent = line || "Last updated: —";
    }

    // Retry with backoff, then stop. A flat 10s retry loop left open in a
    // browser tab overnight is ~360 requests/hour - it would eat the whole
    // 10,000/month free quota by morning if the board happens to be off.
    let retryCount = 0;
    const RETRY_DELAYS = [10, 30, 60, 120, 300]; // seconds, then give up

    function setError(msg) {
      dot("error");
      document.getElementById("status-text").textContent = "Could not reach machine";
      const el = document.getElementById("ip-display");
      el.className = "ip-display error";
      el.textContent = msg;
      document.getElementById("connect-btn").disabled = true;

      const cd = document.getElementById("countdown");

      if (retryCount >= RETRY_DELAYS.length) {
        cd.innerHTML = "Gave up - <a href='#' onclick='manualRetry();return false;' "
                     + "style='color:#00ff88'>retry</a>";
        return;
      }

      let secs = RETRY_DELAYS[retryCount++];
      clearInterval(countdownTimer);
      const tick = () => {
        if (secs <= 0) {
          clearInterval(countdownTimer);
          fetchIP();
          return;
        }
        cd.textContent = `Retrying in ${secs}s...`;
        secs--;
      };
      tick();
      countdownTimer = setInterval(tick, 1000);
    }

    function manualRetry() {
      retryCount = 0;
      fetchIP();
    }

    function dot(state) {
      const el = document.getElementById("dot");
      el.className = "dot";
      if (state === "error") el.classList.add("error");
      if (state === "loading") el.classList.add("loading");
      // "ready" = green pulse (default)
    }

    function scheduleRedirect(ip) {
      let secs = 3;
      document.getElementById("countdown").textContent = `Redirecting in ${secs}s...`;
      clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        secs--;
        if (secs <= 0) {
          clearInterval(countdownTimer);
          document.getElementById("countdown").textContent = "Connecting...";
          window.location.href = `http://${ip}${ESP32_PATH}`;
        } else {
          document.getElementById("countdown").textContent = `Redirecting in ${secs}s...`;
        }
      }, 1000);
    }

    function connectNow() {
      if (currentIP) {
        clearInterval(countdownTimer);
        window.location.href = `http://${currentIP}${ESP32_PATH}`;
      }
    }

    fetchIP();
  </script>
</body>
</html>
