<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ESP32 Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1117;
      font-family: 'Courier New', monospace;
      color: #e0e0e0;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #00ff88;
      display: inline-block;
      margin-right: 8px;
      animation: pulse 1.5s infinite;
    }

    .dot.error { background: #ff4444; animation: none; }
    .dot.loading { background: #ffaa00; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    h1 {
      font-size: 1.1rem;
      font-weight: normal;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 2rem;
    }

    .status-line {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }

    .ip-display {
      font-size: 1.4rem;
      color: #00ff88;
      letter-spacing: 0.05em;
      margin: 1rem 0 1.5rem;
      min-height: 2rem;
    }

    .ip-display.error { color: #ff4444; font-size: 1rem; }

    .btn {
      display: inline-block;
      padding: 0.7rem 1.8rem;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-primary {
      background: #00ff88;
      color: #0f1117;
      font-weight: bold;
    }

    .btn-primary:hover { background: #00cc6a; }
    .btn-primary:disabled { background: #1f4a36; color: #555; cursor: not-allowed; }

    .countdown {
      margin-top: 1.2rem;
      font-size: 0.78rem;
      color: #444;
    }

    .divider {
      border: none;
      border-top: 1px solid #2a2d3a;
      margin: 1.8rem 0;
    }

    .updated {
      font-size: 0.75rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚡ ESP32 Portal</h1>

    <div class="status-line">
      <span class="dot loading" id="dot"></span>
      <span id="status-text">Fetching device IP...</span>
    </div>

    <div class="ip-display" id="ip-display">—</div>

    <button class="btn btn-primary" id="connect-btn" disabled onclick="connectNow()">
      Connect
    </button>

    <div class="countdown" id="countdown"></div>

    <hr class="divider"/>
    <div class="updated" id="last-updated">Last updated: —</div>
  </div>

  <script>
    // ── CONFIG ──────────────────────────────────────────────
    const BIN_ID    = "6a854e40da38895dfef5d53c";   // paste JSONBin bin ID
    const API_KEY   = "$2a$10$xIUsgBA0tRBALwzoMAjI8.xLLqZdn7eyQZKo4GgzlKA33hJ8d3y2O";  // paste JSONBin API key
    const ESP32_PATH = "/";                 // path to open on ESP32
    // ────────────────────────────────────────────────────────

    let currentIP = null;
    let countdownTimer = null;

    async function fetchIP() {
      setLoading();
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { "X-Access-Key": API_KEY }
        });
        if (!res.ok) throw new Error("JSONBin fetch failed");
        const data = await res.json();
        const ip = data.record.ip;
        const updatedAt = data.record.updated_at;

        if (!ip) throw new Error("No IP in record");

        currentIP = ip;
        setReady(ip, updatedAt);
        scheduleRedirect(ip);

      } catch (e) {
        setError(e.message);
      }
    }

    function setLoading() {
      dot("loading");
      document.getElementById("status-text").textContent = "Fetching device IP...";
      document.getElementById("ip-display").className = "ip-display";
      document.getElementById("ip-display").textContent = "—";
      document.getElementById("connect-btn").disabled = true;
      document.getElementById("countdown").textContent = "";
    }

    function setReady(ip, updatedAt) {
      dot("ready");
      document.getElementById("status-text").textContent = "Device found";
      document.getElementById("ip-display").textContent = ip;
      document.getElementById("connect-btn").disabled = false;

      if (updatedAt) {
        const d = new Date(updatedAt);
        document.getElementById("last-updated").textContent =
          "Last seen: " + d.toLocaleString();
      }
    }

    function setError(msg) {
      dot("error");
      document.getElementById("status-text").textContent = "Could not reach device";
      const el = document.getElementById("ip-display");
      el.className = "ip-display error";
      el.textContent = msg;
      document.getElementById("connect-btn").disabled = true;
      document.getElementById("countdown").textContent = "Retrying in 10s...";
      setTimeout(fetchIP, 10000);
    }

    function dot(state) {
      const el = document.getElementById("dot");
      el.className = "dot";
      if (state === "error") el.classList.add("error");
      if (state === "loading") el.classList.add("loading");
      // "ready" = green pulse (default)
    }

    function scheduleRedirect(ip) {
      let secs = 3;
      document.getElementById("countdown").textContent = `Redirecting in ${secs}s...`;
      clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        secs--;
        if (secs <= 0) {
          clearInterval(countdownTimer);
          document.getElementById("countdown").textContent = "Connecting...";
          window.location.href = `http://${ip}${ESP32_PATH}`;
        } else {
          document.getElementById("countdown").textContent = `Redirecting in ${secs}s...`;
        }
      }, 1000);
    }

    function connectNow() {
      if (currentIP) {
        clearInterval(countdownTimer);
        window.location.href = `http://${currentIP}${ESP32_PATH}`;
      }
    }

    fetchIP();
  </script>
</body>
</html>
