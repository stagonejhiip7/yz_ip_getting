<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wire Cutter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1117;
      font-family: 'Courier New', monospace;
      color: #e0e0e0;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #00ff88;
      display: inline-block;
      margin-right: 8px;
      animation: pulse 1.5s infinite;
    }

    .dot.error { background: #ff4444; animation: none; }
    .dot.loading { background: #ffaa00; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    h1 {
      font-size: 1.1rem;
      font-weight: normal;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 2rem;
    }

    .status-line {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }

    .ip-display {
      font-size: 1.4rem;
      color: #00ff88;
      letter-spacing: 0.05em;
      margin: 1rem 0 1.5rem;
      min-height: 2rem;
    }

    .ip-display.error { color: #ff4444; font-size: 1rem; }

    .btn {
      display: inline-block;
      padding: 0.7rem 1.8rem;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-primary {
      background: #00ff88;
      color: #0f1117;
      font-weight: bold;
    }

    .btn-primary:hover { background: #00cc6a; }
    .btn-primary:disabled { background: #1f4a36; color: #555; cursor: not-allowed; }

    .countdown {
      margin-top: 1.2rem;
      font-size: 0.78rem;
      color: #444;
    }

    .divider {
      border: none;
      border-top: 1px solid #2a2d3a;
      margin: 1.8rem 0;
    }

    .updated {
      font-size: 0.75rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>✂️ Wire Cutter</h1>

    <div class="status-line">
      <span class="dot loading" id="dot"></span>
      <span id="status-text">Locating machine...</span>
    </div>

    <div class="ip-display" id="ip-display">—</div>

    <button class="btn btn-primary" id="connect-btn" disabled onclick="connectNow()">
      Connect
    </button>

    <div class="countdown" id="countdown"></div>

    <hr class="divider"/>
    <div class="updated" id="last-updated">Last updated: —</div>
  </div>

  <script>
    // ── CONFIG ──────────────────────────────────────────────
    // Your Worker URL from `npx wrangler deploy` — no trailing slash.
    // GET /ip is public, so there is NO key in this file at all.
    const BIN_ID = "6a854e40da38895dfef5d53c";
    // Set the bin to PUBLIC in JSONBin so no key is needed here. A key in
    // this file is readable by anyone who opens the page, and a JSONBin
    // *master* key can write to ALL your bins - not just this one.
    const API_KEY = "";
    const ESP32_PATH = "/";      // "/" serves breadboardv3.html
    const AUTO_REDIRECT = false; // true = jump automatically after 3s
    // The board only publishes on boot and on IP change - there is no
    // heartbeat. So a long age means "the IP hasn't moved", NOT "the board
    // is off". Stale warnings are therefore disabled; set a number of
    // minutes here to re-enable them.
    const STALE_MINS = null;
    // A successful lookup is cached in localStorage for this many minutes.
    // Refreshing the page inside that window reuses the cached IP and makes
    // ZERO network requests. Without this, a lab full of students hitting
    // refresh is the single fastest way to burn the monthly quota - the
    // retry backoff only protects the failure path, not repeated successes.
    const CACHE_MINS = 15;
    const CACHE_KEY  = "wirecutter_ip_cache";
    // ────────────────────────────────────────────────────────

    let currentIP = null;
    let countdownTimer = null;

    function readCache() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        const c = JSON.parse(raw);
        const ageMin = (Date.now() - c.ts) / 60000;
        return ageMin < CACHE_MINS ? c : null;
      } catch { return null; }
    }

    function writeCache(ip, uptimeS, binTime) {
      try {
        localStorage.setItem(CACHE_KEY,
          JSON.stringify({ ip, uptimeS, binTime, ts: Date.now() }));
      } catch { /* private mode / storage full - just skip caching */ }
    }

    // force=true skips the cache (the Refresh button).
    async function fetchIP(force) {
      if (!force) {
        const c = readCache();
        if (c) {
          currentIP = c.ip;
          setReady(c.ip, c.uptimeS, c.binTime, true);
          document.getElementById("countdown").textContent =
            "Press Connect to open the breadboard tool";
          return;   // no network request at all
        }
      }
      setLoading();
      try {
        const res = await fetch(
          `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,
          { cache: "no-store", headers: API_KEY ? { "X-Access-Key": API_KEY } : {} }
        );
        if (!res.ok) throw new Error(`JSONBin returned ${res.status}`);

        const data = await res.json();
        const record = data.record || {};
        const ip = record.ip;
        if (!ip) throw new Error("No IP published yet");

        // The firmware writes uptime_s, not a timestamp - the ESP32 has no
        // NTP clock. JSONBin's own metadata carries the wall-clock write time.
        const uptimeS = record.uptime_s;
        const binTime = data.metadata && data.metadata.createdAt;

        currentIP = ip;
        retryCount = 0;   // success - reset the backoff ladder
        writeCache(ip, uptimeS, binTime);
        setReady(ip, uptimeS, binTime, false);
        if (AUTO_REDIRECT) scheduleRedirect(ip);
        else document.getElementById("countdown").textContent = "Press Connect to open the breadboard tool";

      } catch (e) {
        setError(e.message);
      }
    }

    function setLoading() {
      dot("loading");
      document.getElementById("status-text").textContent = "Locating machine...";
      document.getElementById("ip-display").className = "ip-display";
      document.getElementById("ip-display").textContent = "—";
      document.getElementById("connect-btn").disabled = true;
      document.getElementById("countdown").textContent = "";
    }

    function setReady(ip, uptimeS, binTime, fromCache) {
      dot("ready");
      document.getElementById("status-text").textContent = "Machine online";
      document.getElementById("ip-display").textContent = ip;
      document.getElementById("connect-btn").disabled = false;

      let line = "";
      if (binTime) {
        const d = new Date(binTime);
        const mins = Math.floor((Date.now() - d.getTime()) / 60000);
        line = mins < 1 ? "IP last changed: just now"
             : mins < 60 ? `IP last changed: ${mins} min ago`
             : mins < 1440 ? `IP last changed: ${Math.floor(mins / 60)}h ago`
             : `IP last changed: ${Math.floor(mins / 1440)} day(s) ago`;

        if (STALE_MINS !== null && mins > STALE_MINS) {
          line += " (stale?)";
          document.getElementById("status-text").textContent = "Machine offline?";
          dot("loading");
        }
      }
      if (uptimeS != null) {
        const h = Math.floor(uptimeS / 3600);
        const m = Math.floor((uptimeS % 3600) / 60);
        line += (line ? " | " : "") + `Board uptime then: ${h}h ${m}m`;
      }
      if (fromCache) line += (line ? " | " : "") + "cached";
      document.getElementById("last-updated").innerHTML =
        (line || "Last updated: —") +
        " &middot; <a href='#' onclick='forceRefresh();return false;' " +
        "style='color:#00ff88;text-decoration:none'>refresh</a>";
    }

    function forceRefresh() {
      try { localStorage.removeItem(CACHE_KEY); } catch {}
      retryCount = 0;
      fetchIP(true);
    }

    // Retry with backoff, then stop. A flat 10s retry loop left open in a
    // browser tab overnight is ~360 requests/hour - it would eat the whole
    // 10,000/month free quota by morning if the board happens to be off.
    let retryCount = 0;
    const RETRY_DELAYS = [10, 30, 60, 120, 300]; // seconds, then give up

    function setError(msg) {
      dot("error");
      document.getElementById("status-text").textContent = "Could not reach machine";
      const el = document.getElementById("ip-display");
      el.className = "ip-display error";
      el.textContent = msg;
      document.getElementById("connect-btn").disabled = true;

      const cd = document.getElementById("countdown");

      if (retryCount >= RETRY_DELAYS.length) {
        cd.innerHTML = "Gave up - <a href='#' onclick='manualRetry();return false;' "
                     + "style='color:#00ff88'>retry</a>";
        return;
      }

      let secs = RETRY_DELAYS[retryCount++];
      clearInterval(countdownTimer);
      const tick = () => {
        if (secs <= 0) {
          clearInterval(countdownTimer);
          fetchIP(true);
          return;
        }
        cd.textContent = `Retrying in ${secs}s...`;
        secs--;
      };
      tick();
      countdownTimer = setInterval(tick, 1000);
    }

    function manualRetry() {
      retryCount = 0;
      fetchIP(true);
    }

    function dot(state) {
      const el = document.getElementById("dot");
      el.className = "dot";
      if (state === "error") el.classList.add("error");
      if (state === "loading") el.classList.add("loading");
      // "ready" = green pulse (default)
    }

    function scheduleRedirect(ip) {
      let secs = 3;
      document.getElementById("countdown").textContent = `Redirecting in ${secs}s...`;
      clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        secs--;
        if (secs <= 0) {
          clearInterval(countdownTimer);
          document.getElementById("countdown").textContent = "Connecting...";
          window.location.href = `http://${ip}${ESP32_PATH}`;
        } else {
          document.getElementById("countdown").textContent = `Redirecting in ${secs}s...`;
        }
      }, 1000);
    }

    function connectNow() {
      if (currentIP) {
        clearInterval(countdownTimer);
        window.location.href = `http://${currentIP}${ESP32_PATH}`;
      }
    }

    fetchIP(false);
  </script>
</body>
</html>
